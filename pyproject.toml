[project]
name = "claude-code-sync-data"
version = "0.1.0"
description = "Экспорт и импорт переписки Claude Code (Markdown, JSON, raw)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sergey Penkovsky" }]
dependencies = []

[project.scripts]
claude-code-export = "export_claude_code:main"
claude-code-import = "import_claude_code:main"

[dependency-groups]
dev = ["ruff>=0.17", "ty>=0.0.102"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["export_claude_code", "import_claude_code"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
# Кириллица в строках и комментариях — это нормально, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]
extend-ignore = [
    "E501", # длину строк держит ruff format; длинные строковые литералы не переносим
]

[tool.ty.environment]
python-version = "3.9"
