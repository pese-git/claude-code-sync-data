[project]
name = "claude-code-sync-data"
version = "0.1.0"
description = "Экспорт, импорт и перенос переписки Claude Code (Markdown, JSON, raw)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sergey Penkovsky" }]
dependencies = []

[project.scripts]
claude-code-sync = "claude_code_sync.cli:main"
# прежние имена команд, оставлены для совместимости
claude-code-export = "claude_code_sync.cli:export_main"
claude-code-import = "claude_code_sync.cli:import_main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17",
    "ty>=0.0.102",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
# Кириллица в строках и комментариях — это нормально, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]
extend-ignore = [
    "E501", # длину строк держит ruff format; длинные строковые литералы не переносим
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
# Предупреждения — ошибки. Вместе с PYTHONWARNDEFAULTENCODING=1 (Python 3.10+) это ловит
# чтение и запись файлов без явной кодировки, которые ломаются на Windows.
filterwarnings = ["error"]

[tool.ty.environment]
python-version = "3.9"
