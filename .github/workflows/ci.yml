name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтеры (ruff, ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Установить зависимости
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format
        run: uv run ruff format --check --diff
      - name: ty check
        run: uv run ty check --output-format=github

  test:
    name: Тесты (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Пути и кодировки ведут себя иначе — проверяем крайние версии Python на macOS и Windows
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Установить зависимости
        run: uv sync --locked
      - name: pytest
        run: uv run pytest
        env:
          PYTHONWARNDEFAULTENCODING: "1" # open()/read_text() без encoding= → ошибка
